[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "LicenseRef-AL-1.1"
license-files = ["LICENSE"]
name = "mnemo-cli"
version = "0.2.0"
description = "A dependency-free, local-first spaced-repetition flashcard CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aegean-E", email = "aegean-licensing@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
mnemo = "mnemo.cli:main"
