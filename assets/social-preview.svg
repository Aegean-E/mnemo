<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="book" data-layout="editorial">
  <title id="title">Mnemo social preview</title>
  <desc id="desc">A dependency-free, local-first spaced-repetition flashcard CLI. Add what you want to remember, study it on the days the SM-2 algorithm says it is due, and watch the schedule stretch as you recall and compress it when you forget. Everything stays in one readable JSON file on your machine.</desc>
